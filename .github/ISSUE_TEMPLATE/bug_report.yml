name: 错误报告
description: 报告可复现的 SoundShare 问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请勿上传 identity.json、服务器密码、Token 或包含个人信息的日志。
  - type: input
    id: version
    attributes:
      label: SoundShare 版本
      placeholder: 例如 v0.1.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 版本
      placeholder: 例如 Windows 11 24H2
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 说明选择的播放器、操作顺序和出现的问题；请隐去真实服务器地址。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
