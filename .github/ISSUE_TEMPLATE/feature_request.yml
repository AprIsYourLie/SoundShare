name: 功能建议
description: 建议新的功能或体验改进
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你希望解决什么问题？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 请说明典型使用流程，以及是否会影响单文件和轻量化目标。
    validations:
      required: true
