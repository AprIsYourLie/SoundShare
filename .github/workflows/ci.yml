name: Windows CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        shell: powershell
        run: .\build.ps1 test
      - name: Test release integrity checks
        shell: powershell
        run: .\scripts\test-release.ps1
      - name: Build and verify release package
        shell: powershell
        run: .\build.ps1 build -Release
      - name: Verify packaged files independently
        shell: powershell
        run: .\scripts\verify-release.ps1
      - name: Upload verified release candidates
        uses: actions/upload-artifact@v4
        with:
          name: SoundShare-Windows-x64-${{ github.sha }}
          if-no-files-found: error
          path: |
            release/SoundShare.exe
            release/SoundShare-Windows-x64.zip
            release/SHA256SUMS.txt
